<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <title>A parede é sua. A mão é nossa.</title>

    <!-- Runtime e fontes são ARQUIVO LOCAL (scripts/ativos.mjs): render determinístico
         não busca nada na rede. Tipografia oficial da Linha Athos. -->
    <link rel="stylesheet" href="assets/fontes.css" />
    <script src="assets/gsap.min.js"></script>

    <style>
      /* Tokens da Linha Athos — os mesmos de app/globals.css do site.
         SEM navy de fundo (A4) e SEM amarelo #FFD200 (A2: nunca sobre papel). */
      :root {
        --papel: #f4efe6;
        --claro: #fbf9f3;
        --ink: #16130e;
        --corpo: #3a3628;
        --cinza: #323c46;
        --ouro: #f0a400;
        --teal: #0097a7;
        --tealtxt: #007681;
        --hairline: #e3dcc8;
        --rejunte: 6px;
        --margem: 76px;

        /* ============================================================
           ESCALA DO QUADRO DEITADO
           ------------------------------------------------------------
               tamanho na tela = autorado × (largura da caixa ÷ largura do quadro)

           Caixa do `<video>` no desktop: 691px de 768 pra cima. Num quadro de
           1280 o fator é 0,5398 — piso de 14px na tela ⇒ NENHUM degrau abaixo
           de 26px autorados. Os NOMES são os mesmos do irmão 9:16.
           ============================================================ */
        --t-titulo: 66px; /* slab display — a abertura              → 35,6px na tela */
        --t-rotulo: 30px; /* mono — o rótulo do beat                → 16,2px */

        --ls-rotulo: 0.22em;
        --lh-titulo: 1.14;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; overflow: hidden; background: var(--papel); }
      body { font-family: "Geist", sans-serif; color: var(--corpo); }

      #root { position: relative; width: 1280px; height: 720px; overflow: hidden; background: var(--papel); }

      .cena { position: absolute; inset: 0; }
      .quadro { position: absolute; inset: 0; }
      /* O fundo mora num filho full-bleed, nunca no root: o compositor do render
         pode descartar o background do próprio elemento raiz. */
      .papel { position: absolute; inset: 0; background: var(--papel); }

      /* rótulo de beat — mono, com a barrinha de ouro da casa */
      .rotulo {
        position: absolute; left: var(--margem); bottom: 58px;
        font-family: "JetBrains Mono", monospace; font-weight: 700;
        font-size: var(--t-rotulo); letter-spacing: var(--ls-rotulo); text-transform: uppercase;
        color: var(--tealtxt); white-space: nowrap;
      }
      .rotulo i { display: block; width: 30px; height: 5px; background: var(--ouro); margin-bottom: 16px; }

      /* ============================================================
         O VOCABULÁRIO DO PANO — as mesmas seis palavras do filme irmão
         (§2.3 do doc-mapa). Nada aqui desenha forma: o azulejo é sempre
         o que o motor emitiu.
         ============================================================ */

      /* 1 · VAGA — o contorno vazio, o combinado que precede o trabalho */
      .vaga { position: relative; background: var(--claro); border: 1px solid var(--hairline); }
      /* 2 · PEÇA ASSENTADA — o azulejo do motor na sua vaga, no esquadro.
            O `z-index` existe porque a peça CHEGA por cima das vizinhas. */
      .vaga .dentro { position: relative; z-index: 1; }
      .vaga .dentro, .vaga .dentro > div { display: block; width: 100%; height: 100%; }
      /* 6 · ACENTO — UMA peça por quadro. Neste filme ele aparece uma vez só, no
            beat da regra: é a peça que está sendo decidida. */
      .vaga.acento { border-color: var(--teal); }
      .vaga.acento .dentro { background: #e6f2f4; }
      /* A MARCA NA VAGA — não confundir com o ACENTO. O contorno em ouro é a cor
         da CASA na parede inteira, uniforme: é o assunto do beat 2 ("a cor está na
         parede antes da peça"), não o destaque de uma peça sobre as outras. */
      .parede.marca > .vaga { border-color: var(--ouro); }

      /* 5 · PAREDE — peças em grade. O `z-index: 0` fecha a grade num contexto de
            empilhamento próprio: sem ele o `z-index` das peças em voo escapa e
            passa por cima do texto. */
      .parede { position: absolute; z-index: 0; display: grid; gap: var(--rejunte); }
      .parede > .vaga { aspect-ratio: 1; }

      /* a peça avulsa: a que chega fora de esquadro e é recolhida */
      .peca { position: absolute; background: var(--claro); border: 2px solid var(--hairline); }
      .peca > div { width: 100%; height: 100%; }

      /* ---- beat 1 — a abertura ---- */
      .titulo {
        position: absolute; left: var(--margem); top: 122px; width: 1000px;
        font-family: "Roboto Slab", serif; font-weight: 800;
        font-size: var(--t-titulo); line-height: var(--lh-titulo); letter-spacing: -0.025em; color: var(--ink);
      }
      .titulo span { display: block; }
      .titulo em { font-style: normal; color: var(--teal); }
      .regua { position: absolute; left: var(--margem); top: 82px; width: 30px; height: 5px; background: var(--ouro); }
      #c1 .parede { left: var(--margem); top: 300px; width: 1128px; grid-template-columns: repeat(12, 1fr); }

      /* ---- beat 2 — a marca antes do desenho ---- */
      #c2 .parede { left: var(--margem); top: 190px; width: 1128px; grid-template-columns: repeat(12, 1fr); }

      /* ---- beat 3 — peça nova, mesma casa ----
         Quinze MOTIVOS diferentes da biblioteca do motor, no MESMO par de cores e
         no MESMO rejunte. É o rejunte constante que costura tudo como uma casa só
         — por isso as peças aqui são maiores: o olho tem que ver que os desenhos
         são diferentes e que a parede continua sendo uma. */
      #c3 .parede { left: 250px; top: 90px; width: 780px; grid-template-columns: repeat(5, 1fr); }

      /* ---- beat 4 — a regra da profissão ----
         Grade mais aberta (9 × 4): a peça que chega fora de esquadro e é recolhida
         precisa ser grande o bastante pra que se veja que ela NÃO foi esquadrada. */
      #c4 .parede { left: var(--margem); top: 60px; width: 1128px; grid-template-columns: repeat(9, 1fr); }
      #c4 .peca { left: 580px; top: 186px; width: 120px; height: 120px; }

      /* ---- beat 5 — a parede fecha ----
         Daqui ela vai até a borda do quadro: é o fecho. */
      #c5 .parede { left: 0; top: 180px; width: 1280px; grid-template-columns: repeat(12, 1fr); }
    </style>
  </head>

    <script>
      /* ================================================================
         A parede é sua. A mão é nossa.
         14,0s · 1280×720 · 30fps · MUDO (sem faixa de áudio).

         O ARGUMENTO: o filme irmão conta o que acontece com UMA PEÇA; este
         conta o que acontece com A MARCA. Ele MOSTRA a presença — e nunca
         NOMEIA a dúvida: nenhum rótulo nega defeito ("não é robô", "nada de
         modelo pronto"), porque negar defeito é plantar a objeção com outra
         roupa (regra 4 das oito).

         A LEI DO ASSENTAMENTO e a costura são as mesmas do `ciclo`, e o
         cabeçalho daquele arquivo as explica por extenso: nenhum azulejo se
         move por vontade própria; a peça chega na corrente (esquerda),
         desacelera e para numa VAGA que já estava no quadro. Dois verbos:
         ASSENTAR e RECOLHER. Aqui o segundo verbo ganha beat próprio — é o
         beat da regra da profissão.
         ================================================================ */
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const VIAGEM = 154; // ~12% do quadro — viagem parcial da CENA
      const SAI = 0.28;
      const ENTRA = 0.34;
      const FIM = 14;

      const CHEGA = 118;
      const POUSO = 0.46;

      /** Jitter determinístico — a mão humana no ritmo, nunca no desenho. */
      const jitter = (i) => ((i * 7) % 5) * 0.012;

      function costura(id, t0, t1, ultima) {
        const q = "#" + id + " .quadro";
        tl.set(q, { x: VIAGEM, opacity: 0.35 }, t0);
        tl.to(q, { x: 0, opacity: 1, duration: ENTRA, ease: "power4.out" }, t0);
        tl.to(q, { x: -VIAGEM, duration: SAI, ease: "power4.in" }, t1 - SAI);
        tl.to(q, { opacity: ultima ? 0.35 : 0, duration: ultima ? SAI : 0.26, ease: "none" }, t1 - SAI);
      }

      costura("c1", 0, 2.8);
      costura("c2", 2.8, 5.7);
      costura("c3", 5.7, 8.5);
      costura("c4", 8.5, 11.3);
      costura("c5", 11.3, FIM, true);

      /** ASSENTAR — o único jeito de uma peça aparecer neste filme. */
      function assentar(cena, t0, cols, quando) {
        gsap.utils.toArray(cena + " .parede > .vaga").forEach((vaga, i) => {
          const dentro = vaga.querySelector(".dentro");
          const t = quando(i % cols, Math.floor(i / cols), i);
          if (t === null) {
            tl.set(dentro, { x: 0, autoAlpha: 1 }, t0);
            return;
          }
          tl.set(dentro, { x: CHEGA, autoAlpha: 0 }, t0);
          tl.to(dentro, { x: 0, autoAlpha: 1, duration: POUSO, ease: "power4.out" }, t);
        });
      }

      /* ---------- 1 · a abertura ----------
         A parede entra JÁ EM CURSO no quadro 0 — e as primeiras peças chegam
         ASSENTADAS, nunca brotando: no quadro 0 as cinco primeiras colunas já
         estão de pé. As vagas já estão todas no ouro da casa. */
      gsap.set("#c1 .quadro", { x: VIAGEM, opacity: 0.35 });
      assentar("#c1", 0, 12, (col, lin, i) => (col < 5 ? null : (col - 5) * 0.11 + lin * 0.05 + jitter(i)));
      gsap.set("#c1 .titulo span:nth-child(1)", { x: 0, autoAlpha: 1 });
      gsap.set("#c1 .titulo span:nth-child(2)", { x: 96, autoAlpha: 0 });
      tl.set("#c1 .titulo span:nth-child(2)", { x: 96, autoAlpha: 0 }, 0);
      tl.to("#c1 .titulo span:nth-child(2)", { x: 0, autoAlpha: 1, duration: 0.34, ease: "power4.out" }, 0.18);
      gsap.set("#c1 .regua", { scaleX: 1, transformOrigin: "0 50%" });

      /* ---------- 2 · a marca antes do desenho ----------
         As VAGAS chegam compostas no corte e já estão no par de cores da marca —
         a parede inteira, uniforme. As peças é que assentam DENTRO delas. A cor
         está na parede ANTES da peça, e é isso que o beat diz. */
      assentar("#c2", 2.8, 12, (col, lin, i) => 3.02 + col * 0.086 + lin * 0.044 + jitter(i));

      /* ---------- 3 · peça nova, mesma casa ----------
         Quinze motivos DIFERENTES assentam lado a lado — e a parede continua
         lendo como uma casa só. Quem costura é o rejunte constante: o intervalo é
         o mesmo entre peças que não se parecem. */
      assentar("#c3", 5.7, 5, (col, lin, i) => 5.92 + (col + lin) * 0.1 + jitter(i));

      /* ---------- 4 · a regra da profissão ----------
         O SEGUNDO VERBO. Uma peça chega fora de esquadro e fica pendente. Em vez
         de ser esquadrada, ela é RECOLHIDA — sai na mesma corrente em que chegou.
         A VAGA FICA (o lugar continua combinado) e a peça seguinte assenta nela,
         no esquadro. O que não pode não entra na parede — e a parede não fica com
         buraco por causa disso.

         A parede chega composta com UMA vaga vazia: a que está em questão. Os dois
         `set` no mesmo instante são intencionais — o segundo sobrescreve o
         primeiro, que é como a vaga 14 sai do estado "assentada" que o
         `assentar()` dá a todas. */
      assentar("#c4", 8.5, 9, () => null);
      tl.set("#c4 .parede > .vaga:nth-child(14) .dentro", { x: CHEGA, autoAlpha: 0 }, 8.5);
      tl.set("#c4 .parede > .vaga:nth-child(14)", { borderColor: "#0097A7" }, 8.5);
      // a peça chega — fora de esquadro, e para. Pendente.
      tl.set("#c4 .peca", { x: CHEGA * 1.6, autoAlpha: 0, rotate: -9, transformOrigin: "50% 50%" }, 8.5);
      tl.to("#c4 .peca", { x: 0, autoAlpha: 1, duration: 0.52, ease: "power4.out" }, 8.86);
      // ---- e ela NÃO é esquadrada: é RECOLHIDA, na mesma corrente ----
      tl.to("#c4 .peca", { x: -CHEGA * 2.2, autoAlpha: 0, duration: 0.5, ease: "power4.in" }, 9.7);
      // a vaga fica, e a peça seguinte assenta nela — no esquadro
      tl.to(
        "#c4 .parede > .vaga:nth-child(14) .dentro",
        { x: 0, autoAlpha: 1, duration: POUSO, ease: "power4.out" },
        10.26,
      );
      tl.to("#c4 .parede > .vaga:nth-child(14)", { borderColor: "#e3dcc8", duration: 0.24, ease: "none" }, 10.62);

      /* ---------- 5 · a parede fecha ----------
         As últimas vagas assentam em cascata ATÉ A BORDA do quadro — o fecho do
         mês. E no fim o rejunte respira UMA vez: um pulso só, curto, que é a
         pontuação da parede assentada. Não é respiração de fundo (isso seria
         movimento sem performance, e a lista do §2.4 reprova) — é um gesto com
         começo e fim, no último meio segundo. */
      assentar("#c5", 11.3, 12, (col, lin, i) => (col < 4 ? null : 11.52 + (col - 4) * 0.096 + lin * 0.04 + jitter(i)));
      tl.set("#c5 .parede", { transformOrigin: "50% 50%" }, 11.3);
      tl.to("#c5 .parede", { scale: 1.014, duration: 0.16, ease: "power2.out" }, 13.02);
      tl.to("#c5 .parede", { scale: 1, duration: 0.34, ease: "power2.inOut" }, 13.18);

      window.__timelines["parede"] = tl;
    </script>
