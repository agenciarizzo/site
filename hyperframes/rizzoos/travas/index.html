  <head>

    <title>As travas — o que o sistema garante sozinho</title>

    <link rel="stylesheet" href="assets/fontes.css" />

    <style>
      /* Mesmos tokens do filme "O ciclo" e de app/globals.css. Sem navy de fundo
         (A4) e sem amarelo #FFD200 (A2: nunca sobre papel). */
      :root {
        --papel: #f4efe6;
        --claro: #fbf9f3;
        --ink: #16130e;
        --corpo: #3a3628;
        --cinza: #323c46;
        --ouro: #f0a400;
        --teal: #0097a7;
        --tealtxt: #007681;
        --tangerina: #e8930a;
        --hairline: #e3dcc8;
        --rejunte: 6px;
        --margem: 76px;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; overflow: hidden; background: var(--papel); }
      body { font-family: "Geist", sans-serif; color: var(--corpo); }

      #root { position: relative; width: 1280px; height: 720px; overflow: hidden; background: var(--papel); }
      .cena { position: absolute; inset: 0; }
      .quadro { position: absolute; inset: 0; }
      .papel { position: absolute; inset: 0; background: var(--papel); }

      .rotulo {
        position: absolute; left: var(--margem); bottom: 62px;
        font-family: "JetBrains Mono", monospace; font-weight: 700;
        font-size: 23px; letter-spacing: 0.24em; text-transform: uppercase;
        color: var(--tealtxt); white-space: nowrap;
      }
      .rotulo i { display: block; width: 30px; height: 4px; background: var(--ouro); margin-bottom: 14px; }

      .chip {
        position: absolute; font-family: "JetBrains Mono", monospace; font-weight: 700;
        font-size: 14px; letter-spacing: 0.18em; text-transform: uppercase;
        border: 2px solid var(--cinza); color: var(--cinza); padding: 7px 14px; background: var(--papel);
        white-space: nowrap;
      }
      .chip.bloqueio { border-color: var(--tangerina); color: var(--ink); }
      .chip.ok { border-color: var(--teal); color: var(--tealtxt); }

      .zona {
        position: absolute; font-family: "JetBrains Mono", monospace; font-weight: 700;
        font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--cinza);
      }

      /* peça: SEMPRE azulejo do motor */
      .peca { position: absolute; background: var(--claro); border: 1px solid var(--hairline); padding: var(--rejunte); }
      .peca > div { width: 100%; height: 100%; }

      /* vaga vazia — o lugar onde a peça deveria cair */
      .vaga { position: absolute; border: 3px dashed var(--hairline); background: transparent; }

      /* ---- 1 · em dobro ---- */
      #t1 .vaga { left: 400px; top: 232px; width: 148px; height: 148px; }
      #t1 .peca.a { left: 400px; top: 232px; width: 148px; height: 148px; }
      #t1 .peca.b { left: 700px; top: 232px; width: 148px; height: 148px; }
      .muro { position: absolute; left: 626px; top: 186px; width: 4px; height: 240px; background: var(--ink); }
      #t1 .risco { position: absolute; left: 686px; top: 302px; width: 176px; height: 5px; background: var(--ink); transform-origin: 0 50%; }
      #t1 .chip { left: 700px; top: 402px; }
      #t1 .chip.publicada { left: 400px; top: 402px; }

      /* ---- 2 · atrasado ---- */
      .relogio { position: absolute; left: 132px; top: 224px; width: 164px; height: 164px; border: 4px solid var(--ink); border-radius: 50%; }
      .relogio i { position: absolute; left: 50%; top: 7px; width: 4px; height: 16px; background: var(--ouro); margin-left: -2px; }
      .relogio b { position: absolute; left: 50%; bottom: 50%; width: 5px; background: var(--ink); transform-origin: 50% 100%; margin-left: -2.5px; }
      .relogio .pont { height: 42px; }
      .relogio .min { height: 62px; }
      .fila { position: absolute; left: 400px; top: 232px; display: flex; gap: 26px; }
      .fila > span { display: block; width: 148px; height: 148px; border: 3px dashed var(--hairline); }
      #t2 .peca { left: 400px; top: 232px; width: 148px; height: 148px; }
      #t2 .chip { left: 574px; top: 402px; }

      /* ---- 3 · legenda vazia ---- */
      #t3 .cartao { position: absolute; left: 200px; top: 214px; width: 560px; display: flex; gap: 26px; align-items: flex-start; }
      #t3 .peca { position: relative; left: auto; top: auto; width: 148px; height: 148px; flex: 0 0 auto; }
      #t3 .legenda { flex: 1; padding-top: 6px; }
      #t3 .legenda b { display: block; height: 14px; border: 2px dashed var(--hairline); margin-bottom: 14px; background: transparent; }
      #t3 .legenda b:nth-child(2) { width: 74%; }
      #t3 .legenda b:nth-child(3) { width: 48%; }
      #t3 .legenda .zona { position: static; display: block; margin-top: 18px; }
      .porta { position: absolute; left: 916px; top: 168px; width: 5px; height: 288px; background: var(--tangerina); }
      #t3 .chip { left: 958px; top: 292px; }

      /* ---- 4 · segredo ---- */
      .divisa { position: absolute; left: 638px; top: 150px; width: 4px; height: 320px; background: var(--ink); }
      #t4 .zona.esq { left: 176px; top: 168px; }
      #t4 .zona.dir { left: 706px; top: 168px; }
      #t4 .caixa { position: absolute; top: 216px; width: 380px; height: 210px; border: 3px solid var(--hairline); background: var(--claro); }
      #t4 .caixa.esq { left: 176px; }
      #t4 .caixa.dir { left: 706px; }
      #t4 .chave { position: absolute; left: 762px; top: 288px; width: 176px; height: 66px; color: var(--ink); }
      #t4 .chave svg { width: 100%; height: 100%; }
      #t4 .xis { position: absolute; left: 604px; top: 276px; width: 72px; height: 72px; color: var(--tangerina); }
      #t4 .xis svg { width: 100%; height: 100%; }
      #t4 .chip { left: 762px; top: 372px; }

      /* ---- 5 · testado ---- */
      #t5 .malha { position: absolute; left: 150px; top: 216px; width: 336px; height: 268px; }
      #t5 .malha [data-pano] { gap: 10px !important; }
      #t5 .malha [data-pano] > div { aspect-ratio: 1; outline: 2px solid transparent; }
      #t5 .peca { left: 762px; top: 268px; width: 164px; height: 164px; }
      #t5 .seta { position: absolute; left: 826px; top: 214px; width: 36px; height: 44px; color: var(--teal); }
      #t5 .seta svg { width: 100%; height: 100%; }
      #t5 .chip { left: 960px; top: 316px; }
    </style>
  </head>

      <!-- ============ 4 · segredo nunca no navegador ============ -->
      <section class="clip cena" id="t4" data-start="8.5" data-duration="2.8" data-track-index="1">
        <div class="quadro">
          <div class="papel"></div>
          <div class="caixa esq"></div>
          <div class="caixa dir"></div>
          <div class="divisa"></div>
          <div class="zona esq">navegador</div>
          <div class="zona dir">servidor</div>
          <div class="chave">
            <svg viewBox="0 0 88 32" fill="none" aria-hidden="true">
              <circle cx="16" cy="16" r="11" stroke="currentColor" stroke-width="5" />
              <path d="M27 16 H82 M68 16 V27 M78 16 V25" stroke="currentColor" stroke-width="5" stroke-linecap="square" />
            </svg>
          </div>

            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M5 5 L19 19 M19 5 L5 19" stroke="currentColor" stroke-width="3.4" stroke-linecap="square" />
            </svg>
          </div>
          <div class="chip ok">fica no servidor</div>
          <div class="rotulo"><i></i>segredo nunca no navegador</div>

      <!-- ============ 5 · testado antes de subir ============ -->
      <section class="clip cena" id="t5" data-start="11.3" data-duration="2.7" data-track-index="1">
        <div class="quadro">
          <div class="papel"></div>
          <div class="malha"><!--PANO:malha--><div data-pano="circulo-triangulo·longe·s87354" style="display:grid;grid-template-columns:repeat(5,1fr);gap:var(--rejunte);width:100%;height:100%"><div style="position:relative;overflow:hidden"><div style="position:absolute;inset:0;background:linear-gradient(to top right, #F0A400 0 49.6%, transparent 50%) no-repeat;transform:rotate(180deg)"></div></div><div style="position:relative;overflow:hidden"><div style="position:absolute;inset:0;background:linear-gradient(to top right, #F0A400 0 49.6%, transparent 50%) no-repeat;transform:rotate(90deg)"></div></div><div style="position:relative;overflow:hidden"><div style="position:absolute;inset:0;background:linear-gradient(to top right, #323C46 0 49.6%, transparent 50%) no-repeat;transform:rotate(90deg)"></div></div><div style="position:relative;overflow:hidden"><div style="position:absolute;inset:0;background:radial-gradient(34% 34% at 50% 50%, #F0A400 0 99%, transparent 99.5%) no-repeat;transform:rotate(0deg)"></div></div><div style="position:relative;overflow:hidden"><div style="position:absolute;inset:0;background:linear-gradient(to top right, #323C46 0 49.6%, transparent 50%) no-repeat;transform:rotate(180deg)"></div></div><div style="position:relative;overflow:hidden"><div style="position:absolute;inset:0;background:radial-gradient(34% 34% at 50% 50%, #F0A400 0 99%, transparent 99.5%) no-repeat;transform:rotate(180deg)"></div></div><div style="position:relative;overflow:hidden"><div style="position:absolute;inset:0;background:linear-gradient(to top right, #F0A400 0 49.6%, transparent 50%) no-repeat;transform:rotate(90deg)"></div></div><div style="position:relative;overflow:hidden"><div style="position:absolute;inset:0;background:radial-gradient(34% 34% at 50% 50%, #323C46 0 99%, transparent 99.5%) no-repeat;transform:rotate(270deg)"></div></div><div style="position:relative;overflow:hidden"><div style="position:absolute;inset:0;background:linear-gradient(to top right, #F0A400 0 49.6%, transparent 50%) no-repeat;transform:rotate(180deg)"></div></div><div style="position:relative;overflow:hidden"><div style="position:absolute;inset:0;background:radial-gradient(34% 34% at 50% 50%, #323C46 0 99%, transparent 99.5%) no-repeat;transform:rotate(0deg)"></div></div><div style="position:relative;overflow:hidden"><div style="position:absolute;inset:0;background:linear-gradient(to top right, #F0A400 0 49.6%, transparent 50%) no-repeat;transform:rotate(90deg)"></div></div><div style="position:relative;overflow:hidden"><div style="position:absolute;inset:0;background:radial-gradient(34% 34% at 50% 50%, #F0A400 0 99%, transparent 99.5%) no-repeat;transform:rotate(270deg)"></div></div><div style="position:relative;overflow:hidden"><div style="position:absolute;inset:0;background:radial-gradient(34% 34% at 50% 50%, #F0A400 0 99%, transparent 99.5%) no-repeat;transform:rotate(0deg)"></div></div><div style="position:relative;overflow:hidden"><div style="position:absolute;inset:0;background:linear-gradient(to top right, #F0A400 0 49.6%, transparent 50%) no-repeat;transform:rotate(270deg)"></div></div><div style="position:relative;overflow:hidden"><div style="position:absolute;inset:0;background:linear-gradient(to top right, #323C46 0 49.6%, transparent 50%) no-repeat;transform:rotate(270deg)"></div></div><div style="position:relative;overflow:hidden"><div style="position:absolute;inset:0;background:radial-gradient(34% 34% at 50% 50%, #F0A400 0 99%, transparent 99.5%) no-repeat;transform:rotate(0deg)"></div></div><div style="position:relative;overflow:hidden"><div style="position:absolute;inset:0;background:linear-gradient(to top right, #323C46 0 49.6%, transparent 50%) no-repeat;transform:rotate(270deg)"></div></div><div style="position:relative;overflow:hidden"><div style="position:absolute;inset:0;background:linear-gradient(to top right, #323C46 0 49.6%, transparent 50%) no-repeat;transform:rotate(90deg)"></div></div><div style="position:relative;overflow:hidden"><div style="position:absolute;inset:0;background:radial-gradient(34% 34% at 50% 50%, #323C46 0 99%, transparent 99.5%) no-repeat;transform:rotate(270deg)"></div></div><div style="position:relative;overflow:hidden"><div style="position:absolute;inset:0;background:linear-gradient(to top right, #323C46 0 49.6%, transparent 50%) no-repeat;transform:rotate(0deg)"></div></div></div><!--/PANO:malha--></div>
          <div class="seta">
            <svg viewBox="0 0 24 30" fill="none" aria-hidden="true">
              <path d="M12 29 V4 M3 13 L12 3 L21 13" stroke="currentColor" stroke-width="3.4" stroke-linecap="square" />
            </svg>
          </div>
          <div class="peca"><!--PANO:peca--><div style="position:relative;overflow:hidden"><div style="position:absolute;inset:0;background:linear-gradient(to top right, #F0A400 0 49.6%, transparent 50%) no-repeat;transform:rotate(90deg)"></div></div><!--/PANO:peca--></div>
          <div class="chip ok">pode subir</div>
          <div class="rotulo"><i></i>testado antes de subir</div>
        </div>

    <script>
      /* ================================================================
         As travas · 14s · 1280×720 · 30fps · MUDO (sem faixa de áudio).

         Cinco garantias, cinco vinhetas de ~2,8s, corte seco entre elas.
         "Corte seco" aqui é o cut-the-curve da casa: hard cut, sem
         dissolve, com a velocidade casada nos dois lados e sempre na
         mesma corrente (ESQUERDA) — inclusive no corte 14s → 0s, que é o
         que faz o loop não dar salto.

         Cada vinheta é uma mecânica só, e a mecânica é CAUSAL: o efeito
         começa no MESMO quadro da causa (a peça bate no muro e para; o
         ponteiro cruza a marca e a peça reagenda).
         ================================================================ */
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const VIAGEM = 154;
      const SAI = 0.26;
      const ENTRA = 0.32;
      const FIM = 14;

      /* Estado do QUADRO 0. Um `tl.set(..., 0)` de duração zero não pinta com a
         cabeça de leitura exatamente em 0 — e o quadro 0 é justo o lado de dentro do
         corte do loop. Então a vinheta 1 não começa do zero: no primeiro quadro a
         vaga e o muro já estão no lugar e as DUAS peças já vêm em rota de colisão. */
      gsap.set("#t1 .quadro", { x: 154, opacity: 0.35 });
      gsap.set("#t1 .peca.a", { x: -168 });
      gsap.set("#t1 .peca.b", { x: 168 });
      gsap.set("#t1 .risco", { autoAlpha: 0, scaleX: 0 });
      gsap.set("#t1 .chip", { autoAlpha: 0, y: 14 });

      function costura(id, t0, t1, ultima) {
        const q = "#" + id + " .quadro";
        tl.set(q, { x: VIAGEM, opacity: 0.35 }, t0);
        tl.to(q, { x: 0, opacity: 1, duration: ENTRA, ease: "power4.out" }, t0);
        tl.to(q, { x: -VIAGEM, duration: SAI, ease: "power4.in" }, t1 - SAI);
        tl.to(q, { opacity: ultima ? 0.35 : 0, duration: ultima ? SAI : 0.24, ease: "none" }, t1 - SAI);
      }

      costura("t1", 0, 2.85);
      costura("t2", 2.85, 5.7);
      costura("t3", 5.7, 8.5);
      costura("t4", 8.5, 11.3);
      costura("t5", 11.3, FIM, true);

      /* Regra que vale nas cinco: a CENA CHEGA COMPOSTA no corte. O cenário de cada
         vinheta (a vaga, o relógio, a fila, a porta, as duas zonas, a malha) já está
         no quadro quando ela entra — quem se move é só a mecânica. Cena que se monta
         DENTRO da janela do corte devolve tela vazia justo onde o olho está viajando. */

      /* ---------- 1 · duas peças, uma vaga ----------
         As duas já vêm rodando desde antes do corte. A da esquerda ocupa a vaga; a da
         direita bate no muro NO MESMO QUADRO em que a outra assenta, recua com o
         impacto e apaga. O sistema não escolhe as duas. */
      tl.set("#t1 .peca.a", { x: -168 }, 0);
      tl.set("#t1 .peca.b", { x: 168 }, 0);
      tl.set("#t1 .risco", { autoAlpha: 0, scaleX: 0 }, 0);
      tl.set("#t1 .chip", { autoAlpha: 0, y: 14 }, 0);
      tl.to("#t1 .peca.a", { x: 0, duration: 0.86, ease: "power2.out" }, 0);
      tl.to("#t1 .peca.b", { x: 24, duration: 0.86, ease: "power2.out" }, 0);
      // a batida e o recuo
      tl.to("#t1 .peca.b", { x: 64, duration: 0.24, ease: "power4.out" }, 0.86);
      tl.to("#t1 .peca.b", { autoAlpha: 0.28, duration: 0.32, ease: "none" }, 0.86);
      tl.to("#t1 .muro", { scaleX: 3.4, duration: 0.1, ease: "power4.out", transformOrigin: "50% 50%" }, 0.86);
      tl.to("#t1 .muro", { scaleX: 1, duration: 0.36, ease: "power4.out" }, 0.96);
      tl.to("#t1 .risco", { autoAlpha: 1, scaleX: 1, duration: 0.24, ease: "power4.out" }, 1.02);
      tl.to("#t1 .chip:not(.publicada)", { autoAlpha: 1, y: 0, duration: 0.24, ease: "power4.out" }, 1.18);
      tl.to("#t1 .chip.publicada", { autoAlpha: 1, y: 0, duration: 0.24, ease: "power4.out" }, 1.46);

      /* ---------- 2 · passou da hora ----------
         Relógio, fila e peça já no quadro. O ponteiro cruza a marca; no mesmo quadro a
         peça salta pra vaga seguinte em vez de sair torta. */
      tl.set("#t2 .relogio .pont", { rotate: -96 }, 2.85);
      tl.set("#t2 .relogio .min", { rotate: -52 }, 2.85);
      tl.set("#t2 .peca", { x: 0 }, 2.85);
      tl.set("#t2 .chip", { autoAlpha: 0, y: 14 }, 2.85);
      tl.set("#t2 .relogio i", { scaleY: 1, transformOrigin: "50% 0%" }, 2.85);
      tl.to("#t2 .relogio .min", { rotate: 38, duration: 0.94, ease: "power2.inOut" }, 3.2);
      tl.to("#t2 .relogio .pont", { rotate: -84, duration: 0.94, ease: "power2.inOut" }, 3.2);
      tl.to("#t2 .relogio i", { scaleY: 2.2, duration: 0.1, ease: "power4.out" }, 3.72);
      tl.to("#t2 .relogio i", { scaleY: 1, duration: 0.32, ease: "power4.out" }, 3.82);
      // o salto pra vaga seguinte começa no quadro da batida
      tl.to("#t2 .peca", { x: 174, duration: 0.48, ease: "power4.out" }, 3.72);
      tl.to("#t2 .chip", { autoAlpha: 1, y: 0, duration: 0.24, ease: "power4.out" }, 4.08);

      /* ---------- 3 · legenda em branco ----------
         O cartão avança pro ar e a porta o segura: as linhas da legenda estão vazias,
         então nada passa. */
      tl.set("#t3 .cartao", { x: -30 }, 5.7);
      tl.set("#t3 .chip", { autoAlpha: 0, y: 14 }, 5.7);
      tl.to("#t3 .cartao", { x: 118, duration: 0.78, ease: "power2.in" }, 5.9);
      // freada seca contra a porta, com o repique curto do impacto
      tl.to("#t3 .cartao", { x: 100, duration: 0.26, ease: "power4.out" }, 6.68);
      tl.to("#t3 .porta", { scaleX: 3, duration: 0.1, ease: "power4.out", transformOrigin: "50% 50%" }, 6.68);
      tl.to("#t3 .porta", { scaleX: 1, duration: 0.36, ease: "power4.out" }, 6.78);
      tl.to("#t3 .chip", { autoAlpha: 1, y: 0, duration: 0.26, ease: "power4.out" }, 6.86);

      /* ---------- 4 · a chave não atravessa ----------
         As duas zonas já estão no quadro. A chave tenta ir pro lado do navegador, bate
         na divisa e volta pro servidor. Ela nunca cruza — é onde ela mora. */
      tl.set("#t4 .chave", { x: 0 }, 8.5);
      tl.set("#t4 .xis", { autoAlpha: 0, scale: 1.8 }, 8.5);
      tl.set("#t4 .chip", { autoAlpha: 0, y: 14 }, 8.5);
      tl.to("#t4 .chave", { x: -102, duration: 0.46, ease: "power2.in" }, 8.86);
      tl.to("#t4 .chave", { x: 0, duration: 0.72, ease: "power4.out" }, 9.32);

      tl.to("#t4 .divisa", { scaleX: 2.8, duration: 0.1, ease: "power4.out", transformOrigin: "50% 50%" }, 9.32);
